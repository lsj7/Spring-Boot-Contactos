<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" th:content="${_csrf.token}">
    <meta name="csrf-header" th:content="${_csrf.headerName}">
    <title th:text="${pageTitle}">Mi Agenda</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark app-nav" th:fragment="nav">
    <div class="container app-container">
        <a class="navbar-brand fw-bold" href="/views/agenda">Mi Agenda</a>
        <div class="nav-actions">
            <a sec:authorize="isAuthenticated()" class="nav-link" href="/views/agenda">Contactos</a>
            <form sec:authorize="isAuthenticated()" class="nav-logout" th:action="@{/logout}" method="post">
                <button class="nav-link nav-button" type="submit">Salir</button>
            </form>
        </div>
    </div>
</nav>
</body>
</html>
