<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Iniciar sesión | Mi Agenda')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container app-container page-content">
    <section class="auth-layout">
        <div class="auth-intro">
            <p class="eyebrow">MI AGENDA</p>
            <h1>Tu directorio, en un solo lugar.</h1>
            <p class="text-secondary">Inicia sesión para consultar y administrar los contactos.</p>
        </div>
        <form class="form-panel" th:action="@{/login}" method="post">
            <h2>Iniciar sesión</h2>
            <p class="text-secondary">Usa la cuenta de administración configurada en el servidor.</p>
            <div class="alert alert-danger" th:if="${param.error}" role="alert">Usuario o contraseña incorrectos.</div>
            <div class="alert alert-success" th:if="${param.logout}" role="alert">Sesión cerrada.</div>
            <label class="form-label" for="username">Usuario</label>
            <input class="form-control mb-3" id="username" name="username" autocomplete="username" required>
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control mb-4" id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="btn btn-primary w-100" type="submit">Entrar</button>
        </form>
    </section>
</main>
</body>
</html>
