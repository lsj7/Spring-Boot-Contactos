spring.application.name=spring-agenda

# Fresh SQLite file, created in the working directory on startup.
spring.datasource.url=jdbc:sqlite:agenda-spring.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# One admin account. Set both environment variables before starting.
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

server.port=8080
spring.mvc.problemdetails.enabled=false
